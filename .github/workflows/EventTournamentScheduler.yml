name: Deploy EventTournamentScheduler
on:
  workflow_dispatch:
  push:
    branches:
    - master
    - Release
permissions:
  id-token: write
  contents: read
  
env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_FUNCTIONAPP_NAME: EventTournamentScheduler
  AZURE_FUNCTIONAPP_PACKAGE_PATH: .\published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: EventTournamentScheduler/EventTournamentScheduler.csproj
  AZURE_RESOURCE_GROUP: Alexandria
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: functionapp
        path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        include-hidden-files: true
        if-no-files-found: error
  deploy:
    # The Azure federated credential currently trusts only master.
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-EventTournamentScheduler
      cancel-in-progress: false
    runs-on: windows-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: functionapp
        path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        # Optional dedicated identity; see .github/DEPLOYMENT.md for Azure RBAC setup.
        client-id: ${{ secrets.AZURE_FUNCTIONAPP_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID}}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
    - name: Verify Function App access and deployment package
      shell: pwsh
      run: |
        az functionapp show --subscription $env:AZURE_SUBSCRIPTION_ID --resource-group $env:AZURE_RESOURCE_GROUP --name $env:AZURE_FUNCTIONAPP_NAME --query id --output tsv
        if ($LASTEXITCODE -ne 0) {
          throw 'Cannot access the Function App. Grant the selected OIDC identity Website Contributor on EventTournamentScheduler; see .github/DEPLOYMENT.md.'
        }
        foreach ($file in @('.azurefunctions', 'host.json', 'functions.metadata', 'worker.config.json', 'EventTournamentScheduler.dll')) {
          if (-not (Test-Path (Join-Path $env:AZURE_FUNCTIONAPP_PACKAGE_PATH $file))) {
            throw "Function deployment artifact is missing $file"
          }
        }
    - name: Deploy to Azure Function App
      uses: azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
