# The retired scheduler now deploys the Dispatcher Web App.
name: Deploy SengokuDispatcher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build solution
      run: dotnet build SengokuProvider.API/SengokuProvider.API.sln --configuration Release
    - name: Run regression checks
      shell: pwsh
      run: ./tests/Run-RegressionTests.ps1 -Configuration Release
    - name: Publish Dispatcher API
      run: dotnet publish SengokuDispatcher.API/SengokuDispatcher.API.csproj --configuration Release --no-build --output ./dispatcher-publish
    - uses: actions/upload-artifact@v4
      with:
        name: dispatcher-api
        path: ./dispatcher-publish
        if-no-files-found: error
  deploy:
    # Reuse the Provider identity's existing master-branch OIDC trust.
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-sengoku-dispatcher
      cancel-in-progress: false
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dispatcher-api
        path: ./dispatcher-publish
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    - name: Deploy Dispatcher Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: sengoku-dispatcher
        package: ./dispatcher-publish
