name: Dispatcher QA-Deploy

on:
  workflow_dispatch:
  push:
    branches:
    - master
    - 'dev/**'
    - 'features/**'
    - Release

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: sengoku-dispatcher
  AZURE_WEBAPP_PACKAGE_PATH: .\dispatcher-publish
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: SengokuProvider.API/SengokuProvider.API.sln

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore -p:SourceRevisionId=${{ github.sha }}
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build
    - name: Run regression checks
      shell: pwsh
      run: ./tests/Run-RegressionTests.ps1 -Configuration ${{ env.CONFIGURATION }}
    - name: Publish Dispatcher
      run: dotnet publish SengokuDispatcher.API/SengokuDispatcher.API.csproj --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Upload Dispatcher artifact
      uses: actions/upload-artifact@v4
      with:
        name: dispatcher-api
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
        if-no-files-found: error

  integration:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/local-e2e.yml
    secrets:
      PRIVATE_DATABASE_FIXTURES_B64: ${{ secrets.PRIVATE_DATABASE_FIXTURES_B64 }}

  deploy:
    # Match QA: other branches build and test; only master deploys.
    if: github.ref == 'refs/heads/master'
    concurrency:
      group: deploy-sengoku-dispatcher
      cancel-in-progress: false
    runs-on: windows-latest
    needs: [build, integration]
    steps:
    - uses: actions/checkout@v4
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: dispatcher-api
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure Login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FC459755C9D54C87907DEB1A2686CDD7 }}
        tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F2779150072645388F272A9AE6D4CC97 }}
        subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_789DE045DFED43268E6E1E641EBE7441 }}
    - name: Configuration preflight
      shell: pwsh
      run: ./.github/scripts/Test-DeploymentReadiness.ps1 -AppName ${{ env.AZURE_WEBAPP_NAME }} -Service Dispatcher -ConfigurationOnly
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        slot-name: Production
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Verify deployed revision and delivery readiness
      shell: pwsh
      run: ./.github/scripts/Test-DeploymentReadiness.ps1 -AppName ${{ env.AZURE_WEBAPP_NAME }} -Service Dispatcher -ExpectedRevision '${{ github.sha }}'
